<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: http: data: blob:; media-src https: http: blob:; frame-src https: http: blob:; connect-src https: http:; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
{{META}}
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#5d6472;--line:#e3e6eb;--accent:#1f6feb;--accent-text:#fff;--ok:#1a7f37;--bad:#cf222e;--code:#f3f4f6;--k:#8250df;--s:#0a7a3b;--n:#b35900;--c:#6e7781}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#e8eaee;--muted:#9aa3b2;--line:#2a2f38;--accent:#4c8dff;--accent-text:#fff;--ok:#3fb950;--bad:#f85149;--code:#11141a;--k:#c297ff;--s:#56d364;--n:#f0a35e;--c:#8b949e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;overflow:hidden}
h1{font-size:20px;line-height:1.3;margin:0 0 4px;word-break:break-word}
.meta{color:var(--muted);font-size:13px;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn[disabled]{opacity:.55;cursor:default}
.preview{margin-top:4px;border-radius:10px;overflow:hidden;background:var(--code);display:flex;justify-content:center}
.preview img,.preview video{display:block;max-width:100%;max-height:75vh;height:auto}
.preview audio{width:100%;margin:16px}
.preview iframe{width:100%;height:75vh;border:0;background:#fff}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.icon{font-size:44px;line-height:1;margin-bottom:8px}
pre{margin:0;padding:16px;background:var(--code);border-radius:10px;overflow:auto;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;tab-size:4;max-height:75vh}
pre.wrap{white-space:pre-wrap;word-break:break-word}
.tk-k{color:var(--k)}.tk-s{color:var(--s)}.tk-n{color:var(--n)}.tk-c{color:var(--c);font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none;background:var(--card)}
.tile .thumb{aspect-ratio:4/3;background:var(--code);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.tile .thumb img{width:100%;height:100%;object-fit:cover}
.tile .cap{padding:8px 10px;font-size:13px}
.tile .cap b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cap span{color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:32px 16px;text-align:center;margin-top:16px}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.drop p{margin:8px 0 0;color:var(--muted);font-size:14px}
.list{list-style:none;margin:16px 0 0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .state{color:var(--muted);white-space:nowrap}
.list li .state.ok{color:var(--ok)}.list li .state.bad{color:var(--bad)}
progress{width:110px;height:6px}
.note{white-space:pre-wrap;margin:0 0 8px}
.hint{color:var(--muted);font-size:13px;margin-top:12px}
.error{color:var(--bad);margin-top:12px}
form.pw{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
form.pw input{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit}
footer{margin-top:20px;text-align:center;font-size:12px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<main id="app"><noscript>This page needs JavaScript.</noscript></main>

// The encrypted file format of docs/share-pages.md ("Encrypted links"):
// a 42-byte header, then AES-256-GCM records. Kept free of the DOM so
// scripts/share-page tests can run it in Node.
var AKTAR_HEADER_LENGTH = 42;
var AKTAR_TAG_LENGTH = 16;

function aktarError(code) { var e = new Error(code); e.aktar = code; return e; }

function aktarParseHeader(h) {
  if (h.length !== AKTAR_HEADER_LENGTH || h[0] !== 0x41 || h[1] !== 0x4b || h[2] !== 0x45 || h[3] !== 0x31) throw aktarError('damaged');
  var view = new DataView(h.buffer, h.byteOffset, h.byteLength);
  var header = {
    bytes: h,
    version: h[4],
    kdf: h[5],
    iterations: view.getUint32(6),
    salt: h.slice(10, 26),
    noncePrefix: h.slice(26, 34),
    recordSize: view.getUint32(34),
    metaLength: view.getUint32(38)
  };
  if (header.version !== 1) throw aktarError('damaged');
  if (header.kdf === 0) {
    if (header.iterations !== 0) throw aktarError('damaged');
  } else if (header.kdf === 1) {
    if (header.iterations < 100000 || header.iterations > 10000000) throw aktarError('damaged');
  } else {
    throw aktarError('damaged');
  }
  if (header.recordSize < 1024 || header.recordSize > 16777216) throw aktarError('damaged');
  if (header.metaLength < AKTAR_TAG_LENGTH + 2 || header.metaLength > 65536 + AKTAR_TAG_LENGTH) throw aktarError('damaged');
  return header;
}

function aktarBase64urlDecode(text) {
  if (!/^[A-Za-z0-9_-]*$/.test(text)) return null;
  var b64 = text.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  try {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  } catch (e) { return null; }

// The key of a link: "#k=<base64url of 32 bytes>".
function aktarKeyFromFragment(fragment) {
  var params = new URLSearchParams((fragment || '').replace(/^#/, ''));
  var raw = params.get('k');
  if (!raw) return null;
  var bytes = aktarBase64urlDecode(raw);
  return bytes && bytes.length === 32 ? bytes : null;
}

function aktarImportKey(raw) {
  return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']);
}

function aktarDeriveKey(password, header) {
  var bytes = new TextEncoder().encode(String(password).normalize('NFC'));
  return crypto.subtle.importKey('raw', bytes, 'PBKDF2', false, ['deriveKey']).then(function (base) {
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: header.salt, iterations: header.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  });

function aktarOpenRecord(key, header, index, final, sealed) {
  var nonce = new Uint8Array(12);
  nonce.set(header.noncePrefix, 0);
  new DataView(nonce.buffer).setUint32(8, index);
  var aad = new Uint8Array(AKTAR_HEADER_LENGTH + 1);
  aad.set(header.bytes, 0);
  aad[AKTAR_HEADER_LENGTH] = final ? 1 : 0;
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce, additionalData: aad, tagLength: 128 }, key, sealed)
    .then(function (plain) { return new Uint8Array(plain); });
}

function AktarQueue() { this.parts = []; this.length = 0; }
AktarQueue.prototype.push = function (bytes) { if (bytes.length) { this.parts.push(bytes); this.length += bytes.length; } };
AktarQueue.prototype.take = function (n) {
  var out = new Uint8Array(n), at = 0;
  while (at < n) {
    var first = this.parts[0], need = n - at;
    if (first.length <= need) { out.set(first, at); at += first.length; this.parts.shift(); }
    else { out.set(first.subarray(0, need), at); this.parts[0] = first.subarray(need); at += need; }
  }
  this.length -= n;
  return out;
};

// read(): resolves to the next chunk of the encrypted file (Uint8Array) or
// null at its end. keyFor(header): resolves to the AES key. onProgress(bytes)

// decrypted content records, in order).

    return fill(header.metaLength);

    return aktarOpenRecord(key, header, 0, false, queue.take(header.metaLength)).catch(function () { throw aktarError('wrongKey'); });

    try { meta = JSON.parse(new TextDecoder().decode(plain)); } catch (e) { throw aktarError('damaged'); }

    for (var i = 0; i < parts.length; i++) size += parts[i].length;

    return { meta: meta, parts: parts };

    var row = el('div', { class: 'row' });
    // Up to 1 GB is zipped in the browser; above that each file is downloaded on its own.
    if (files.length > 1 && total <= 1e9 && window.fetch) {
      var all = el('button', { class: 'btn primary', type: 'button', text: t('downloadAll') });
      all.addEventListener('click', function () {
        all.disabled = true; all.textContent = t('zipping');
        var names = uniqueNames(files), entries = [];
        files.reduce(function (p, f, i) {
          return p.then(function () {
            return fetch(safeURL(f.url)).then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.arrayBuffer(); })
              .then(function (buf) { entries.push({ name: names[i], bytes: new Uint8Array(buf) }); });
          });
        }, Promise.resolve()).then(function () {
          var a = el('a', { href: URL.createObjectURL(makeZip(entries)), download: 'files.zip' });
          document.body.appendChild(a); a.click(); a.remove();
          all.disabled = false; all.textContent = t('downloadAll');
        }, function () { all.disabled = false; all.textContent = t('failed'); });
      });
      row.appendChild(all);
    }
    row.appendChild(copyButton(t('copyLink'), function () { return location.href; }));
    render([el('div', { class: 'card' }, [
      el('h1', { text: t('nFiles', { n: String(files.length) }) }),
      metaLine([formatSize(total), formatDate(data.created), expiryText()]),
      grid, row
    ]), footer()]);
  }

  function showEncrypted() {
    var enc = data.encrypted || {};
    var url = safeURL(enc.url);
    var card = el('div', { class: 'card' });
    var status = el('p', { class: 'meta' });
    render([card, footer()]);
    function fail(code) {
      card.textContent = '';
      card.appendChild(el('h1', { text: t('encrypted') }));
      card.appendChild(el('p', { class: 'error', text: t(code === 'missingKey' ? 'missingKey' : code === 'wrongKey' ? 'wrongPassword' : code === 'expired' ? 'expired' : code === 'unavailable' ? 'unavailable' : 'damaged') }));
    }
    if (!url) { fail('unavailable'); return; }

    function run(keyFor) {
      card.textContent = '';
      card.appendChild(el('h1', { text: t('encrypted') }));
      card.appendChild(status);
      status.textContent = t('decrypting');
      fetch(url).then(function (response) {
        if (response.status === 403) throw aktarError(isExpired() ? 'expired' : 'unavailable');
        if (!response.ok) throw aktarError('unavailable');
        var reader = response.body && response.body.getReader ? response.body.getReader() : null;
        var whole = null;
        var read = reader
          ? function () { return reader.read().then(function (r) { return r.done ? null : r.value; }); }
          : function () { if (whole === 'done') return Promise.resolve(null); return response.arrayBuffer().then(function (b) { whole = 'done'; return new Uint8Array(b); }); };
        var size = typeof enc.size === 'number' ? enc.size : 0;
        return aktarDecrypt(read, keyFor, function (n) {
          if (size > 0) status.textContent = t('decrypting') + ' ' + Math.min(100, Math.round(n * 100 / size)) + '%';
        });
      }).then(function (result) {
        var meta = result.meta;
        var type = /^[\w.+-]+\/[\w.+-]+$/.test(meta.type) ? meta.type : 'application/octet-stream';
        var blob = new Blob(result.parts, { type: type });
        var blobURL = URL.createObjectURL(blob);
        var name = String(meta.name).replace(/[\\/]/g, '_') || 'file';
        var note = el('p', { class: 'hint', text: '🔒 ' + t('e2eNote') });
        var isText = type.indexOf('text/') === 0 || /^application\/(json|xml|javascript|x-sh|x-yaml|toml)$/.test(type);
        if (isText && blob.size <= 1000000) {
          return blob.text().then(function (text) {
            var syntax = meta.syntax && /^[a-z0-9+#-]{1,20}$/.test(meta.syntax) ? meta.syntax : null;
            render([textCard(name, text, syntax, blobURL, [metaLine([formatSize(blob.size), expiryText()])]), el('div', null, [note]), footer()]);
          });
        }
        var row = el('div', { class: 'row' }, [downloadLink(blobURL, name, true), copyButton(t('copyLink'), function () { return location.href; })]);
        render([el('div', { class: 'card' }, [
          el('h1', { text: name }),
          metaLine([formatSize(blob.size), expiryText()]),
          preview(blobURL, type, name), row, note
        ]), footer()]);
      }).catch(function (e) {
        if (e && e.aktar === 'wrongKey' && enc.password) { askPassword(true); return; }
        fail(e && e.aktar ? e.aktar : 'damaged');
      });
    }

    function askPassword(again) {
      card.textContent = '';
      var input = el('input', { type: 'password', autocomplete: 'off', placeholder: t('password'), 'aria-label': t('password') });
      var form = el('form', { class: 'pw' }, [input, el('button', { class: 'btn primary', type: 'submit', text: t('unlock') })]);
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var password = input.value;
        if (!password) return;
        run(function (header) { if (header.kdf !== 1) throw aktarError('damaged'); return aktarDeriveKey(password, header); });
      });
      card.appendChild(el('h1', { text: t('encrypted') }));
      card.appendChild(metaLine([formatSize(enc.size), expiryText()]));
      if (again) card.appendChild(el('p', { class: 'error', text: t('wrongPassword') }));
      card.appendChild(form);
      input.focus();
    }

    if (isExpired()) { fail('expired'); return; }
    if (enc.password) { askPassword(false); return; }
    var raw = aktarKeyFromFragment(location.hash);
    if (!raw) { fail('missingKey'); return; }
    run(function (header) { if (header.kdf !== 0) throw aktarError('damaged'); return aktarImportKey(raw); });
  }

  function showRequest() {
    var req = data.request || {};
    if (isExpired()) { expiredCard(); return; }
    var slots = (req.slots || []).filter(function (s) { return safeURL(s.file) && safeURL(s.meta); });
    var maxBytes = typeof req.maxBytes === 'number' && req.maxBytes > 0 ? Math.min(req.maxBytes, 5e9) : 5e9;
    // The next slot to try survives a reload, so a sender on a provider
    // without conditional writes doesn't write over their own files.
    var storeKey = 'aktar-request:' + location.pathname;
    var next = 0, busy = false, queue = [];
    try { var saved = parseInt(localStorage.getItem(storeKey), 10); if (saved > 0) next = saved; } catch (e) {}
    function advance() { next++; try { localStorage.setItem(storeKey, String(next)); } catch (e) {} }
    var list = el('ul', { class: 'list' });
    var input = el('input', { type: 'file', multiple: true, hidden: true });
    var choose = el('button', { class: 'btn primary', type: 'button', text: t('chooseFiles') });
    choose.addEventListener('click', function () { input.click(); });
    var drop = el('div', { class: 'drop' }, [choose, el('p', { text: t('orDrop') })]);
    var message = el('p', { class: 'error' });
    message.hidden = true;

    function put(url, body, type, onProgress) {
      return new Promise(function (resolve) {
        var xhr = new XMLHttpRequest();
        xhr.open('PUT', url);
        xhr.setRequestHeader('Content-Type', type);
        if (req.conditional) xhr.setRequestHeader('If-None-Match', '*');
        if (onProgress && xhr.upload) xhr.upload.onprogress = function (e) { if (e.lengthComputable) onProgress(e.loaded / e.total); };
        xhr.onload = function () { resolve(xhr.status); };
        xhr.onerror = function () { resolve(0); };
        xhr.send(body);
      });
    }
    function send(item) {
      if (next >= slots.length) { item.fail(t('full')); return Promise.resolve(); }
      var slot = slots[next];
      item.start();
      return put(slot.file, item.file, 'application/octet-stream', item.progress).then(function (status) {
        if (status === 412) { advance(); return send(item); }
        if (status === 403) { item.fail(t(isExpired() ? 'expired' : 'failed')); return; }
        if (status < 200 || status >= 300) { item.fail(t('failed'), true); return; }
        advance();
        var meta = JSON.stringify({ v: 1, name: item.file.name, type: item.file.type || '', size: item.file.size, sent: new Date().toISOString() });
        // The file is there either way; without its metadata the app names it upload-<n>.
        function putMeta(tries) {
          return put(slot.meta, new Blob([meta], { type: 'application/json' }), 'application/json').then(function (s) {
            if ((s < 200 || s >= 300) && s !== 412 && tries > 1) return putMeta(tries - 1);
          });
        }
        return putMeta(3).then(function () { item.done(); });
      });
    }
    function pump() {
      if (busy) return;
      var item = queue.shift();
      if (!item) return;
      busy = true;
      send(item).then(function () { busy = false; pump(); });
    }
    function add(file) {
      var state = el('span', { class: 'state' });
      var bar = el('progress', { max: '1', value: '0' });
      bar.hidden = true;
      var row = el('li', null, [el('span', { class: 'name', text: file.name }), bar, state]);
      list.appendChild(row);
      var item = {
        file: file,
        start: function () { state.textContent = t('sending'); state.className = 'state'; bar.hidden = false; bar.value = 0; },
        progress: function (f) { bar.value = f; },
        done: function () { bar.hidden = true; state.textContent = t('sent'); state.className = 'state ok'; },
        fail: function (text, retry) {
          bar.hidden = true; state.textContent = text; state.className = 'state bad';
          if (retry) {
            var again = el('button', { class: 'btn', type: 'button', text: t('retry') });
            again.addEventListener('click', function () { again.remove(); queue.push(item); pump(); });
            row.appendChild(again);
          }
        }
      };
      if (file.size > maxBytes) { item.fail(t('tooLarge', { size: formatSize(maxBytes) })); return; }
      queue.push(item);
      pump();
    }
    input.addEventListener('change', function () { Array.prototype.forEach.call(input.files || [], add); input.value = ''; });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault(); drop.classList.remove('over');
      Array.prototype.forEach.call((e.dataTransfer && e.dataTransfer.files) || [], add);
    });
    render([el('div', { class: 'card' }, [
      el('h1', { text: req.title || t('sendFiles') }),
      metaLine([expiryText()]),
      req.note ? el('p', { class: 'note', text: req.note }) : null,
      drop, input, list, message,
      el('p', { class: 'hint', text: t('requestHint') + ' ≤ ' + formatSize(maxBytes) })
    ]), footer()]);
  }

  if (data.kind !== 'encrypted' && data.kind !== 'request' && isExpired()) { expiredCard(); return; }
  if (data.kind === 'file') showFile();
  else if (data.kind === 'text') showText();
  else if (data.kind === 'gallery') showGallery();
  else if (data.kind === 'encrypted') showEncrypted();
  else if (data.kind === 'request') showRequest();
  else app.textContent = 'This page could not be read.';
})();
</script>
</body>
</html>
