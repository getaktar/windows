name: Installer

# Builds a test installer without releasing anything: run it from the
# Actions tab, then download the "Aktar-installer" artifact on a Windows PC.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/build.ps1 keeps the runner's paths out of aktar.exe and
      # checks that it did. Without the updater key (a fork, or a private
      # test copy of the repo) the installer is built without the update
      # files, which a test installer doesn't need.
      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password (GitHub secrets can't be empty).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            ./scripts/build.ps1
          } else {
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path no-updater.json
            ./scripts/build.ps1 --config no-updater.json
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aktar-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 14

      # Signed with a throwaway certificate so it can be installed for
      # testing; the artifact includes the .cer to trust first (see
      # scripts/pack_msix.ps1).
      - name: Package the MSIX
        shell: pwsh
        run: ./scripts/pack_msix.ps1 -SignForTesting

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aktar-msix
          path: |
            src-tauri/target/msix/*.msix
            src-tauri/target/msix/*.cer
          retention-days: 14
