name: Release

# Push a v<version> tag (matching "version" in src-tauri/tauri.conf.json) to
# build the installer and create a draft GitHub release. Review the draft,
# then publish it: installed copies only see an update once the release is
# published, since they read latest.json from /releases/latest/.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json', encoding='utf-8'))['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $VERSION in tauri.conf.json" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keeps the runner's paths (and user name) out of aktar.exe; see
      # scripts/remap_paths.ps1.
      - name: Remap build paths
        shell: pwsh
        run: |
          $flags = ./scripts/remap_paths.ps1
          "CARGO_ENCODED_RUSTFLAGS=$flags" >> $env:GITHUB_ENV

      # Builds the NSIS installer, signs it for the updater with the
      # minisign key (its public half is plugins.updater.pubkey), and
      # uploads the installer, its .sig, and latest.json to a draft release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password (GitHub secrets can't be empty).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Aktar ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new in this version.
          releaseDraft: true
          includeUpdaterJson: true

      # Before anything else is uploaded. If it fails, the draft release is
      # left as is: delete it, fix the build, and tag again.
      - name: Check the binary for build machine paths
        shell: pwsh
        run: ./scripts/check_binary.ps1 -Path src-tauri/target/release/aktar.exe

      # A stable name, so https://github.com/getaktar/windows/releases/latest/download/Aktar-Setup.exe
      # always points at the newest installer.
      - name: Upload Aktar-Setup.exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INSTALLER=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$INSTALLER" Aktar-Setup.exe
          gh release upload "$GITHUB_REF_NAME" Aktar-Setup.exe --clobber

      # The Microsoft Store package, from the same aktar.exe. It's unsigned:
      # upload it in Partner Center, and the Store signs it. Skipped until
      # packaging/msix/identity.json has the identity reserved there.
      - name: Package for the Microsoft Store
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $identity = Get-Content packaging/msix/identity.json -Raw | ConvertFrom-Json
          if ($identity.name -eq 'Aktar.Local') {
            Write-Output "::notice::No Store identity in packaging/msix/identity.json yet; skipping the MSIX."
            exit 0
          }
          ./scripts/pack_msix.ps1
          gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem src-tauri/target/msix/*.msix).FullName --clobber
