name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs for pull requests from forks too, so the token only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build the frontend
        run: pnpm build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      # The storage layer against a real S3-compatible server (moto).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # moto 5.2 answers ListParts with a ListPartsResponse root element,
      # which the Rust SDK rejects (S3 itself sends ListPartsResult), so the
      # multipart tests need the 5.1 series.
      - name: Storage tests against moto
        shell: bash
        run: |
          pip install "moto[server]<5.2" boto3
          moto_server -H 127.0.0.1 -p 9100 &
          sleep 3
          python -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9100', aws_access_key_id='AKIATEST', aws_secret_access_key='secret', region_name='us-east-1').create_bucket(Bucket='aktar-test')"
          cd src-tauri
          AKTAR_TEST_S3_ENDPOINT=http://127.0.0.1:9100 cargo test storage -- --ignored

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action requires a paid license for org-owned repos;
      # the underlying gitleaks CLI itself is free, so install and run it
      # directly instead.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose
